<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#09090b">
<title>Спич-Радар</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'], mono: ['JetBrains Mono', 'ui-monospace', 'monospace'] } } } };
</script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://unpkg.com/lucide@0.344.0/dist/umd/lucide.min.js"></script>
<style>
  :root {
    --bg: #09090b; --card: #121215; --line: #27272a; --line2: #3f3f46;
    --ink: #fafafa; --mut: #a1a1aa; --dim: #71717a;
    --g: #4ade80; --a: #fbbf24; --r: #f87171; --b: #60a5fa;
  }
  html { font-size: 16px; }
  @media (min-width: 1600px) { html { font-size: 18px; } }
  @media (min-width: 2200px) { html { font-size: 22px; } }
  html, body { background: var(--bg); }
  body { font-family: 'Inter', system-ui, sans-serif; color: #e4e4e7; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
  .num { font-family: 'JetBrains Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  :focus-visible { outline: 1px solid var(--ink); outline-offset: 2px; }
  .hide { display: none !important; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; }

  .t-green { --c: #4ade80; --cb: rgba(74,222,128,.10); --cl: rgba(74,222,128,.35); }
  .t-blue  { --c: #60a5fa; --cb: rgba(96,165,250,.10); --cl: rgba(96,165,250,.35); }
  .t-amber { --c: #fbbf24; --cb: rgba(251,191,36,.10); --cl: rgba(251,191,36,.38); }
  .t-red   { --c: #f87171; --cb: rgba(248,113,113,.11); --cl: rgba(248,113,113,.42); }
  .t-idle  { --c: #a1a1aa; --cb: rgba(161,161,170,.08); --cl: rgba(161,161,170,.25); }

  .tag { display: inline-flex; align-items: center; width: fit-content; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
         font-size: .7rem; font-weight: 600; line-height: 1; padding: .22rem .45rem; border-radius: 4px;
         color: var(--c); background: var(--cb); border: 1px solid var(--cl); transition: color .25s, background .25s, border-color .25s; }

  .metric { --c: var(--ink); padding: .5rem .65rem; display: flex; flex-direction: column; gap: .3rem; min-width: 0; transition: border-color .3s, background-color .3s; }
  .metric .lbl { display: flex; align-items: center; justify-content: space-between; gap: .4rem; color: var(--dim); font-size: .7rem; font-weight: 500; }
  .metric .lbl span { display: inline-flex; align-items: center; gap: .3rem; white-space: nowrap; }
  .metric .val { color: var(--c); font-size: 1.85rem; line-height: 1; font-weight: 500; letter-spacing: -.02em; transition: color .25s; }
  @media (min-width: 768px) { .metric .val { font-size: 2.2rem; } .metric { padding: .6rem .8rem; } }
  .metric.hot { border-color: var(--a); background-color: rgba(251,191,36,.07); }
  @keyframes pulseRed {
    0% { background-color: rgba(248,113,113,.35); border-color: #f87171; }
    100% { background-color: var(--card); border-color: var(--line); }
  }
  .pulse-red { animation: pulseRed .9s ease-out; }

  .scale { position: relative; height: 6px; border-radius: 3px; margin-top: .15rem;
           background: linear-gradient(90deg, #60a5fa 0 45%, #fbbf24 45% 47.5%, #4ade80 47.5% 72.5%, #fbbf24 72.5% 75%, #f87171 75% 100%); opacity: .9; }
  .scale i { position: absolute; top: -4px; width: 3px; height: 14px; border-radius: 1px; background: var(--ink); box-shadow: 0 0 0 2px var(--card); left: 0; transition: left .35s ease-out, opacity .3s; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: .4rem; height: 2.1rem; padding: 0 .8rem; border-radius: 6px;
         font-size: .8rem; font-weight: 600; color: #e4e4e7; background: #18181b; border: 1px solid var(--line2); white-space: nowrap; transition: background .15s, border-color .15s, opacity .15s; }
  .btn:hover:not(:disabled) { background: #232328; border-color: #52525b; }
  .btn:active:not(:disabled) { transform: translateY(1px); }
  .btn:disabled { opacity: .35; cursor: not-allowed; }
  .btn-pri { background: var(--ink); color: #09090b; border-color: var(--ink); }
  .btn-pri:hover:not(:disabled) { background: #e4e4e7; border-color: #e4e4e7; }
  .btn-ico { width: 2.1rem; padding: 0; }

  .seg { display: inline-flex; border: 1px solid var(--line2); border-radius: 6px; overflow: hidden; background: #18181b; }
  .seg button { height: 2.1rem; padding: 0 .65rem; font-size: .78rem; font-weight: 600; color: var(--mut); transition: background .15s, color .15s; }
  .seg button + button { border-left: 1px solid var(--line2); }
  .seg button:hover { color: var(--ink); }
  .seg button[aria-pressed="true"] { background: #2a2a30; color: var(--ink); }

  .tabs { display: flex; gap: .15rem; border-bottom: 1px solid var(--line); padding: 0 .4rem; overflow-x: auto; scrollbar-width: none; flex: none; }
  .tab { display: inline-flex; align-items: center; gap: .4rem; padding: .6rem .8rem; font-size: .8rem; font-weight: 600; color: var(--dim); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
  .tab:hover { color: var(--ink); }
  .tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
  .pane { display: none; flex: 1; min-height: 0; flex-direction: column; }
  .pane.on { display: flex; }
  .scroll { overflow-y: auto; scrollbar-width: thin; scrollbar-color: #3f3f46 transparent; }

  #transcript { font-size: clamp(1.1rem, 1.1vw + .65rem, 1.8rem); line-height: 1.6; color: #f4f4f5; }
  #interimText { color: var(--dim); }
  .para { display: inline-block; padding: 0 .35rem; margin: 0 .05rem; border-radius: 4px; font-weight: 600; line-height: 1.4;
          background: rgba(248,113,113,.18); color: #fecaca; border: 1px solid #f87171; animation: pop .25s ease-out; }
  .para.pending { border-style: dashed; animation: none; background: rgba(248,113,113,.09); }
  @keyframes pop { from { transform: scale(.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  .chip { display: inline-flex; align-items: center; gap: .3rem; padding: .25rem .3rem .25rem .65rem; border-radius: 6px; background: rgba(248,113,113,.10); border: 1px solid rgba(248,113,113,.4); color: #fecaca; font-size: .9rem; font-weight: 500; }
  .chip button { display: inline-flex; width: 1.4rem; height: 1.4rem; align-items: center; justify-content: center; border-radius: 4px; color: #fca5a5; }
  .chip button:hover { background: rgba(248,113,113,.3); color: #fff; }
  .field { width: 100%; background: #0c0c0f; border: 1px solid var(--line2); border-radius: 6px; padding: .5rem .7rem; color: var(--ink); font-size: .9rem; }
  .field::placeholder { color: var(--dim); }
  .field:focus { outline: none; border-color: var(--mut); }
  input[type="range"] { accent-color: #fafafa; }

  .sw { color: #e4e4e7; transition: color .3s; border-radius: 3px; }
  .sw.read { color: #52525b; }
  .sw.cur { color: #09090b; background: var(--g); box-shadow: 0 0 0 .12rem var(--g); }

  /* Таймлайн */
  .track { position: relative; flex: 1; height: 6px; border-radius: 3px; background: #27272a; }
  .fill { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 3px; background: var(--g); transition: background .3s; }
  .mk { position: absolute; top: 50%; width: 18px; height: 18px; transform: translate(-50%, -50%); display: grid; place-items: center; z-index: 2; }
  .mk::after { content: ''; width: 9px; height: 9px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 2px var(--card); }
  .mk-para { --c: #f87171; }
  .mk-pause { --c: #fbbf24; }
  #tip { position: fixed; z-index: 90; transform: translate(-50%, -100%); pointer-events: none; padding: .3rem .55rem; border-radius: 5px;
         background: #18181b; border: 1px solid var(--line2); font-size: .75rem; font-weight: 500; color: var(--ink); white-space: nowrap; }

  .bar-track { height: 8px; background: #27272a; border-radius: 2px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--r); width: 0; transition: width .8s cubic-bezier(.2,.8,.2,1); }

  .tip-row { display: flex; gap: .7rem; padding: .7rem .8rem; border-radius: 6px; background: var(--cb); border: 1px solid var(--cl); }
  .tip-row svg { color: var(--c); flex: none; margin-top: 2px; }
  .tip-row h4 { color: var(--c); font-weight: 600; font-size: .95rem; }
  .tip-row p { color: #d4d4d8; font-size: .9rem; line-height: 1.35; }

  .ring-bg { stroke: #27272a; }
  .ring-fg { transition: stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1); }

  #toasts { position: fixed; right: .75rem; bottom: .75rem; z-index: 95; display: flex; flex-direction: column; gap: .4rem; align-items: flex-end; }
  .toast { padding: .5rem .8rem; border-radius: 6px; font-size: .8rem; font-weight: 600; background: #18181b; border: 1px solid var(--cl); color: var(--c); animation: pop .2s ease-out; max-width: 22rem; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>

<div id="app" class="h-[100dvh] overflow-hidden flex flex-col gap-2 p-2 md:p-3">

  <!-- Шапка -->
  <header class="card px-2.5 py-2 flex flex-wrap items-center gap-x-3 gap-y-2 md:flex-nowrap">
    <div class="order-1 flex items-center gap-2">
      <i data-lucide="radar" class="w-5 h-5" style="color:var(--g)"></i>
      <h1 class="font-semibold tracking-wide text-sm md:text-base">СПИЧ-РАДАР</h1>
    </div>
    <div id="clock" class="order-2 ml-auto md:order-4 md:ml-1 num text-xl md:text-2xl font-medium" style="color:var(--g)">03:00</div>
    <div class="order-3 md:order-2 seg" role="group" aria-label="Режим">
      <button id="modeLive" aria-pressed="true">Микрофон</button>
      <button id="modeDemo" aria-pressed="false">Демо</button>
    </div>
    <div class="order-3 md:order-3 seg" id="targetSeg" role="group" aria-label="Регламент">
      <button data-sec="60" aria-pressed="false" class="num">1м</button>
      <button data-sec="180" aria-pressed="true" class="num">3м</button>
      <button data-sec="300" aria-pressed="false" class="num">5м</button>
    </div>
    <div class="order-5 w-full md:w-auto md:ml-auto flex gap-1.5">
      <button id="btnStart" class="btn btn-pri flex-1 md:flex-none md:min-w-[7.5rem]"></button>
      <button id="btnReport" class="btn btn-ico md:w-auto md:px-3" disabled title="Отчёт" aria-label="Отчёт"><i data-lucide="file-bar-chart" class="w-4 h-4"></i><span class="hidden md:inline">Отчёт</span></button>
      <button id="btnReset" class="btn btn-ico" title="Сброс" aria-label="Сброс"><i data-lucide="rotate-ccw" class="w-4 h-4"></i></button>
      <button id="btnSound" class="btn btn-ico" title="Звук" aria-label="Звук" aria-pressed="true"><i data-lucide="volume-2" class="w-4 h-4"></i></button>
    </div>
  </header>

  <!-- Уведомление -->
  <div id="notice" class="card hide px-3 py-2 flex flex-wrap items-center gap-2 t-amber" style="border-color:var(--cl)" role="alert">
    <i data-lucide="alert-triangle" class="w-4 h-4 shrink-0" style="color:var(--c)"></i>
    <p class="flex-1 min-w-[12rem] text-sm"><b id="noticeTitle"></b> <span id="noticeText" class="text-zinc-400"></span></p>
    <button id="noticeDemo" class="btn btn-pri">Запустить демо</button>
    <button id="noticeClose" class="btn btn-ico" aria-label="Закрыть"><i data-lucide="x" class="w-4 h-4"></i></button>
  </div>

  <!-- Метрики -->
  <section class="grid grid-cols-2 md:grid-cols-4 gap-2" aria-label="Метрики">
    <article id="cardWpm" class="card metric t-idle">
      <div class="lbl"><span><i data-lucide="gauge" class="w-3.5 h-3.5"></i>Темп (WPM)</span><span class="num" id="wpmAvg">ср —</span></div>
      <div class="flex items-end justify-between gap-2"><div class="val num" id="wpmVal">0</div><div class="tag" id="wpmTag">Ожидание</div></div>
      <div class="scale" aria-hidden="true"><i id="wpmMark"></i></div>
    </article>
    <article id="cardPurity" class="card metric t-green">
      <div class="lbl"><span><i data-lucide="spell-check" class="w-3.5 h-3.5"></i>Чистота</span></div>
      <div class="flex items-end justify-between gap-2"><div class="val num" id="purityVal">100%</div><div class="tag" id="purityTag">Чисто</div></div>
    </article>
    <article id="cardPara" class="card metric t-green">
      <div class="lbl"><span><i data-lucide="ban" class="w-3.5 h-3.5"></i>Паразиты</span></div>
      <div class="flex items-end justify-between gap-2"><div class="val num" id="paraVal">0</div><div class="tag" id="paraTag">Нет</div></div>
    </article>
    <article id="cardPause" class="card metric t-green">
      <div class="lbl"><span><i data-lucide="hourglass" class="w-3.5 h-3.5"></i>Паузы</span><span class="num" id="silenceNow">—</span></div>
      <div class="flex items-end justify-between gap-2"><div class="val num" id="pauseVal">0</div><div class="tag" id="pauseTag">Нет</div></div>
    </article>
  </section>

  <!-- Волна и таймлайн -->
  <section class="card px-2.5 py-2 flex flex-col gap-1.5">
    <div class="flex items-center gap-3">
      <canvas id="wave" class="flex-1 min-w-0 block" style="height:44px" aria-label="Звуковая волна"></canvas>
      <div class="shrink-0 w-[7.6rem] md:w-[11rem] flex flex-col gap-1 items-start" id="monoBox">
        <span class="text-[.65rem] md:text-[.7rem] font-medium leading-tight" style="color:var(--dim)">Динамика голоса <span class="hidden md:inline">(Монотонность)</span></span>
        <div class="flex items-center gap-1.5 max-w-full"><span class="tag t-idle" id="monoTag">Нет данных</span><span class="num text-[.68rem]" style="color:var(--dim)" id="monoSigma"></span></div>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <span class="num text-[.7rem] w-9 text-right" style="color:var(--mut)" id="tlElapsed">0:00</span>
      <div class="track" id="track">
        <div class="fill" id="tlFill"></div>
        <div id="markers"></div>
      </div>
      <span class="num text-[.7rem] w-9" style="color:var(--dim)" id="tlTotal">3:00</span>
    </div>
  </section>

  <!-- Эфир / Суфлёр / Словарь -->
  <section class="card flex-1 min-h-0 flex flex-col overflow-hidden">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="live" aria-selected="true"><i data-lucide="mic" class="w-4 h-4"></i>Живой эфир</button>
      <button class="tab" role="tab" data-tab="script" aria-selected="false"><i data-lucide="scroll-text" class="w-4 h-4"></i>Суфлёр</button>
      <button class="tab" role="tab" data-tab="dict" aria-selected="false"><i data-lucide="list" class="w-4 h-4"></i>Словарь</button>
    </div>

    <div id="pane-live" class="pane on">
      <div id="transcript" class="scroll flex-1 min-h-0 p-3 md:p-4">
        <p id="placeholder" class="text-zinc-500"></p>
        <span id="finalText"></span><span id="interimText"></span>
      </div>
    </div>

    <div id="pane-script" class="pane p-2.5 md:p-3 gap-2">
      <div class="flex flex-wrap items-center gap-2 flex-none">
        <div class="seg" role="group" aria-label="Вид">
          <button id="viewEdit" aria-pressed="true">Текст</button>
          <button id="viewPrompt" aria-pressed="false">Суфлёр</button>
        </div>
        <span id="scriptStats" class="num text-xs" style="color:var(--mut)"></span>
        <span id="scriptFit" class="tag t-idle hide"></span>
        <div class="ml-auto flex gap-1.5">
          <button id="scriptSample" class="btn">Пример</button>
          <button id="scriptClear" class="btn btn-ico" aria-label="Очистить"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
        </div>
      </div>
      <textarea id="scriptArea" class="field scroll flex-1 min-h-0 resize-none leading-relaxed" placeholder="Вставьте текст доклада"></textarea>
      <div id="prompter" class="hide scroll relative flex-1 min-h-0 rounded-md border p-3 md:p-4" style="border-color:var(--line);background:#0c0c0f;font-size:clamp(1.3rem,1.4vw + .8rem,2.2rem);line-height:1.65"></div>
    </div>

    <div id="pane-dict" class="pane p-3 md:p-4 scroll">
      <div id="chips" class="flex flex-wrap gap-1.5 mb-3"></div>
      <form id="addForm" class="flex flex-wrap gap-2 mb-4" autocomplete="off">
        <input id="addInput" class="field flex-1 min-w-[10rem]" type="text" maxlength="40" placeholder="Новое слово или фраза">
        <button type="submit" class="btn btn-pri"><i data-lucide="plus" class="w-4 h-4"></i>Добавить</button>
        <button type="button" id="dictReset" class="btn">По умолчанию</button>
      </form>
      <label for="pauseRange" class="flex items-center gap-3 text-sm">
        <span class="text-zinc-400">Порог паузы</span>
        <input id="pauseRange" type="range" min="2" max="6" step="0.5" value="3.5" class="flex-1 max-w-xs">
        <span id="pauseRangeVal" class="num">3.5 с</span>
      </label>
    </div>
  </section>
</div>

<div id="tip" class="hide" role="tooltip"></div>

<!-- Отчёт -->
<div id="report" class="hide fixed inset-0 z-50 overflow-y-auto" style="background:var(--bg)">
  <div class="mx-auto max-w-[110rem] p-2 md:p-4 flex flex-col gap-2 md:gap-3">
    <div class="flex items-center justify-between gap-2">
      <h2 class="font-semibold tracking-wide text-base md:text-lg">ОТЧЁТ</h2>
      <div class="flex gap-1.5">
        <button id="reportBack" class="btn"><i data-lucide="x" class="w-4 h-4"></i>Закрыть</button>
        <button id="reportNew" class="btn btn-pri"><i data-lucide="rotate-ccw" class="w-4 h-4"></i>Заново</button>
      </div>
    </div>

    <div class="grid gap-2 md:gap-3 lg:grid-cols-12">
      <section id="scoreCard" class="card p-4 lg:col-span-5 flex flex-col sm:flex-row lg:flex-col xl:flex-row items-center gap-4">
        <div class="relative w-[9.5rem] h-[9.5rem] shrink-0">
          <svg viewBox="0 0 120 120" class="w-full h-full -rotate-90" aria-hidden="true">
            <circle class="ring-bg" cx="60" cy="60" r="52" fill="none" stroke-width="8"></circle>
            <circle id="ringFg" class="ring-fg" cx="60" cy="60" r="52" fill="none" stroke-width="8" stroke-linecap="butt" stroke-dasharray="326.73" stroke-dashoffset="326.73" stroke="#4ade80"></circle>
          </svg>
          <div class="absolute inset-0 flex flex-col items-center justify-center">
            <span id="scoreNum" class="num text-4xl font-medium" style="color:var(--c)">0</span>
            <span class="num text-xs" style="color:var(--dim)">/ 100</span>
          </div>
        </div>
        <div class="flex-1 min-w-0 w-full">
          <h3 id="verdict" class="text-lg md:text-xl font-semibold mb-3"></h3>
          <div id="scoreStats" class="grid grid-cols-3 gap-2"></div>
        </div>
      </section>
      <section class="card p-3 md:p-4 lg:col-span-7">
        <h3 class="font-semibold mb-2 flex items-center gap-2 text-sm"><i data-lucide="check-circle-2" class="w-4 h-4"></i>Что исправить</h3>
        <div id="tips" class="flex flex-col gap-2"></div>
      </section>
    </div>

    <section class="card p-3 md:p-4">
      <h3 class="font-semibold mb-2 flex items-center gap-2 text-sm"><i data-lucide="activity" class="w-4 h-4"></i>Темп речи по времени <span class="num font-normal text-xs" style="color:var(--dim)">шаг 10 с</span></h3>
      <div id="chartWrap" class="relative" style="height:min(20rem,38vh)"><canvas id="chartCanvas"></canvas></div>
      <p id="chartEmpty" class="hide py-8 text-center text-zinc-500"></p>
    </section>

    <div class="grid gap-2 md:gap-3 md:grid-cols-3">
      <section class="card p-3 md:p-4">
        <h3 class="font-semibold mb-3 flex items-center gap-2 text-sm"><i data-lucide="audio-lines" class="w-4 h-4"></i>Динамика голоса</h3>
        <div id="intoBox"></div>
      </section>
      <section class="card p-3 md:p-4">
        <h3 class="font-semibold mb-3 flex items-center gap-2 text-sm"><i data-lucide="ban" class="w-4 h-4"></i>Топ паразитов</h3>
        <div id="topPara" class="flex flex-col gap-3"></div>
      </section>
      <section class="card p-3 md:p-4">
        <h3 class="font-semibold mb-3 flex items-center gap-2 text-sm"><i data-lucide="file-text" class="w-4 h-4"></i>Текст</h3>
        <div id="reportText" class="scroll max-h-[16rem] pr-1 leading-relaxed text-zinc-200"></div>
      </section>
    </div>
  </div>
</div>

<div id="toasts" aria-live="polite"></div>

<script>
(() => {
'use strict';

/* ============ Константы ============ */

const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const mmss2 = sec => { sec = Math.max(0, Math.round(sec)); return String(Math.floor(sec / 60)).padStart(2, '0') + ':' + String(sec % 60).padStart(2, '0'); };

const plural = n => (n % 10 === 1 && n % 100 !== 11) ? 'раз' : ((n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20)) ? 'раза' : 'раз');
const icons = () => { if (window.lucide) { try { window.lucide.createIcons(); } catch (e) { /* иконки необязательны */ } } };
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* хранилище недоступно */ } }

const setTone = (el, tone) => { TONE_NAMES.forEach(t => el.classList.remove('t-' + t)); el.classList.add('t-' + tone); };

/* ============ Демо-сценарий (около 50 секунд) ============ */
const DEMO = [

const IS_MOBILE = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent || '') || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
// На телефонах и после обнаруженного конфликта волна не открывает второй поток микрофона: он глушит распознавание

/* ============ Состояние ============ */
const freshSession = () => ({
  status: 'idle', starting: false, acc: 0, segStart: 0,
  wordEvents: [], firstT: null, lastT: 0,
  counts: new Map(), parasites: 0, lastPara: '',
  pauses: 0, inPause: false, hasSpoken: false, lastSpeechTime: 0, lastWordTime: 0, silenceCarry: 0,
  loudTicks: 0, sigMax: 0, deadMs: 0, audioFallback: analyserBlocked(),
  markers: [], curPause: null,
  interim: '', interimWords: 0, interimTimes: [], interimProcessed: 0, chunks: [],
  overNotified: false,
  rec: null, recFatal: false, quickEnds: 0, netErr: 0, recStartedAt: 0,
  recBeganAt: 0, recAudio: false, lastRecAct: 0, noRecMs: 0, recRestarts: 0, silentWarned: false, lastFinalKey: '', lastFinalAt: 0,

});
const S = Object.assign({

try {

const elapsed = () => S.status === 'running' ? S.acc + (performance.now() - S.segStart) : S.acc;

/* ============ Поиск слов-паразитов ============ */
let phraseIndex = new Map();
function rebuildIndex() {
  phraseIndex = new Map();
  S.dict.forEach(p => {
    const parts = p.split(/\s+/).map(norm).filter(Boolean);
    if (!parts.length) return;
    if (!phraseIndex.has(parts[0])) phraseIndex.set(parts[0], []);
    phraseIndex.get(parts[0]).push({ parts, label: p });
  });
  phraseIndex.forEach(arr => arr.sort((a, b) => b.parts.length - a.parts.length));
}
function analyze(text, pending) {
  const toks = text.split(/\s+/).filter(Boolean);
  const cores = toks.map(norm);
  const out = [], hits = [], idx = [];
  let i = 0, words = 0;
  while (i < toks.length) {
    if (!cores[i]) { out.push(esc(toks[i])); i++; continue; }
    let matched = null;
    const cand = phraseIndex.get(cores[i]);
    if (cand) {
      for (const c of cand) {
        let ok = true;
        for (let k = 0; k < c.parts.length; k++) { if (cores[i + k] !== c.parts[k]) { ok = false; break; } }
        if (ok) { matched = c; break; }
      }
    }
    if (matched) {
      const len = matched.parts.length;
      out.push('<span class="para' + (pending ? ' pending' : '') + '">' + esc(toks.slice(i, i + len).join(' ')) + '</span>');
      hits.push(matched.label); idx.push(i); words += len; i += len;
    } else { out.push(esc(toks[i])); words++; i++; }
  }
  return { html: out.join(' '), hits, idx, words, cores };
}

/* ============ DOM ============ */
const btnStart = $('#btnStart'), btnReport = $('#btnReport'), btnReset = $('#btnReset'), btnSound = $('#btnSound');

/* ============ Уведомления ============ */
const NOTICES = {

/* ============ Звуковой движок (Web Audio, осцилляторы) ============ */
const sfx = { ctx: null, on: true, mutedUntil: 0 };
function sfxCtx() {
  if (!sfx.ctx) {
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return null;
    try { sfx.ctx = new C(); } catch (e) { return null; }
  }
  if (sfx.ctx.state === 'suspended') { try { sfx.ctx.resume(); } catch (e) { /* ждём жеста */ } }
  return sfx.ctx;
}
function tone(freq, start, dur, vol, type) {
  const c = sfxCtx();
  if (!c) return;
  const t0 = c.currentTime + start;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0 + dur + 0.03);
}
const play = {
  parasite() {
    if (!sfx.on) return;
    tone(220, 0, 0.08, 0.2, 'triangle');
    tone(180, 0.1, 0.08, 0.2, 'triangle');
    sfx.mutedUntil = Date.now() + 500;
    try { if (navigator.vibrate) navigator.vibrate(70); } catch (e) { /* вибрация недоступна */ }
  },
  pause() {
    if (!sfx.on) return;
    tone(1320, 0, 0.05, 0.06, 'sine');
    sfx.mutedUntil = Date.now() + 400;
  },
  start() {
    if (!sfx.on) return;
    tone(523, 0, 0.09, 0.12, 'sine');
    tone(784, 0.1, 0.16, 0.12, 'sine');
    sfx.mutedUntil = Date.now() + 450;
  },
  finish() {
    if (!sfx.on) return;
    tone(784, 0, 0.09, 0.12, 'sine');
    tone(659, 0.1, 0.09, 0.12, 'sine');
    tone(523, 0.2, 0.22, 0.12, 'sine');
    sfx.mutedUntil = Date.now() + 600;
  }
};

/* ============ Микрофон: AudioContext + AnalyserNode ============ */
const aud = { stream: null, ctx: null, analyser: null, fft: null, noise: new Float32Array(NB), calib: 0 };
async function initAudio() {
  if (aud.analyser) return 'ok';
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return 'none';
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const Ctx = window.AudioContext || window.webkitAudioContext;
    const ctx = new Ctx();
    if (ctx.state === 'suspended') { try { await ctx.resume(); } catch (e) { /* продолжаем */ } }
    const analyser = ctx.createAnalyser();
    analyser.fftSize = 128;
    analyser.smoothingTimeConstant = 0.55;
    analyser.minDecibels = -90;
    analyser.maxDecibels = -20;
    ctx.createMediaStreamSource(stream).connect(analyser);
    aud.stream = stream; aud.ctx = ctx; aud.analyser = analyser;
    aud.fft = new Uint8Array(analyser.frequencyBinCount);
    aud.noise = new Float32Array(NB);
    aud.calib = performance.now();
    return 'ok';
  } catch (e) {
    const n = e && e.name;
    if (n === 'NotAllowedError' || n === 'SecurityError' || n === 'PermissionDeniedError') return 'denied';
    if (n === 'NotFoundError' || n === 'DevicesNotFoundError' || n === 'OverconstrainedError') return 'nomic';
    return 'none';
  }
}
function stopAudio() {
  try { if (aud.stream) aud.stream.getTracks().forEach(t => t.stop()); } catch (e) { /* уже остановлен */ }
  try { if (aud.ctx) aud.ctx.close(); } catch (e) { /* уже закрыт */ }
  aud.stream = null; aud.ctx = null; aud.analyser = null; aud.fft = null;
}
const audioActive = () => !!aud.analyser && !S.audioFallback;

function degradeAudio() {
  if (S.audioFallback || S.mode !== 'live') return false;
  S.audioFallback = true;
  store.set('speechRadar.noAnalyser', '1');
  stopAudio();
  toast('Микрофон занят распознаванием: волна упрощена', 'amber');
  return true;
}

/* ============ Активность речи и паузы ============ */
function touchSpeech(kind) {
  const now = Date.now();
  S.lastSpeechTime = now;
  S.hasSpoken = true;
  if (kind === 'word') S.lastWordTime = now;
  if (S.inPause) {
    S.inPause = false;
    if (S.curPause) {
      S.curPause.dur = (now - S.curPause.silStart) / 1000;
      S.curPause = null;
      renderMarkers();
    }
  }
}

function addMarker(type, t, word) {
  const m = { type, t, word: word || '', dur: 0, silStart: 0 };
  S.markers.push(m);
  renderMarkers();
  return m;
}
const markerLabel = m => m.type === 'para'
  ? 'Паразит «' + m.word + '» · ' + fmtMs(m.t)
  : 'Пауза ' + (m.dur ? m.dur.toFixed(1) : '> ' + (S.pauseMs / 1000).toFixed(1)) + ' с · ' + fmtMs(m.t);

function renderMarkers() {
  const total = S.target * 1000;
  markersEl.innerHTML = S.markers.map((m, i) =>
    '<button type="button" class="mk mk-' + m.type + '" data-i="' + i + '" style="left:' + (clamp(m.t / total, 0, 1) * 100).toFixed(2) + '%" aria-label="' + esc(markerLabel(m)) + '"></button>'
  ).join('');
}
let tipTimer = null;
function showTip(btn) {
  const m = S.markers[Number(btn.dataset.i)];
  if (!m) return;
  tipEl.textContent = markerLabel(m);
  tipEl.classList.remove('hide');
  const r = btn.getBoundingClientRect();
  tipEl.style.left = clamp(r.left + r.width / 2, 80, window.innerWidth - 80) + 'px';
  tipEl.style.top = (r.top - 6) + 'px';
}
const hideTip = () => tipEl.classList.add('hide');
markersEl.addEventListener('mouseover', e => { const b = e.target.closest('.mk'); if (b) showTip(b); });
markersEl.addEventListener('mouseout', e => { if (e.target.closest('.mk')) hideTip(); });

markersEl.addEventListener('focusout', hideTip);
markersEl.addEventListener('click', e => {
  const b = e.target.closest('.mk');

/* Независимый таймер: паузы, тишина, монотонность */
let ticker = null;
function startTicker() { stopTicker(); ticker = setInterval(tick250, 250); }
function stopTicker() { if (ticker) { clearInterval(ticker); ticker = null; } }

function tick250() {
  if (S.status !== 'running') return;
  const now = Date.now();

  // Активность по громкости микрофона
  if (S.mode === 'live' && audioActive()) {
    const loud = S.sigMax > SPEECH_THR && now > sfx.mutedUntil;
    S.sigMax = 0;
    if (loud) {
      S.loudTicks++;
      if (S.hasSpoken || S.loudTicks >= 2) touchSpeech('sound');
    } else { S.loudTicks = 0; }
    // Датчик "мертвого" микрофона (Android отдаёт тишину, пока идёт распознавание)
    if (now - S.lastWordTime < 1500 && S.hasSpoken && S.sig < 0.002) S.deadMs += 250; else S.deadMs = 0;
    if (S.deadMs >= 5000) degradeAudio();
    // Звук есть, а распознаватель молчит: микрофон занят волной, отдаём его распознаванию
    if (now - S.lastRecAct <= 2500) S.noRecMs = 0;
    else if (loud) S.noRecMs += 250;
    if (S.noRecMs >= 4000) { S.noRecMs = 0; if (degradeAudio()) restartRecognizer(); }
  } else if (S.mode === 'demo' && S.demoSpeaking) {
    touchSpeech('sound');
  }

  // Распознаватель так и не получил звук
  if (S.mode === 'live' && S.rec && !S.recAudio && performance.now() - S.recBeganAt > 6000) {
    if (S.recRestarts < 2) { S.recRestarts++; restartRecognizer(); }
    else if (!S.silentWarned) { S.silentWarned = true; showNotice('silent'); }
  }

  // Пауза
  if (S.hasSpoken && !S.inPause && now - S.lastSpeechTime > S.pauseMs) {
    S.inPause = true;
    S.pauses++;
    const m = addMarker('pause', elapsed());
    m.silStart = S.lastSpeechTime;
    S.curPause = m;
    play.pause();
  }

  monoTick();
}

function monoTick() {
  const n = S.loud.length;
  if (n < 30 || (S.mode === 'live' && !audioActive())) { S.cv = null; return; }
  const blocks = [];
  for (let i = n - 1; i - 4 >= 0 && blocks.length < 20; i -= 5) {
    let s = 0;
    for (let k = 0; k < 5; k++) s += S.loud[i - k];
    blocks.push(s / 5);
  }
  const mean = blocks.reduce((a, b) => a + b, 0) / blocks.length;
  const sd = Math.sqrt(blocks.reduce((a, b) => a + (b - mean) * (b - mean), 0) / blocks.length);
  S.cv = mean > 0 ? sd / mean : 0;
  const el = elapsed();
  if (el - S.lastCvT >= 1000) {
    S.lastCvT = el;
    S.cvHist.push({ t: el, cv: S.cv });
    if (S.cv < MONO_CV) S.monoSecs++; else S.liveSecs++;
  }
}

/* ============ Ввод слов: interim и final ============ */
function setInterim(text) {
  text = (text || '').trim();
  if (text === S.interim) return;
  const toks = text ? text.split(/\s+/).filter(Boolean) : [];
  const el = elapsed();
  while (S.interimTimes.length < toks.length) S.interimTimes.push(el);
  if (S.interimTimes.length > toks.length) S.interimTimes.length = toks.length;
  S.interim = text;
  if (text) {
    const a = analyze(text, true);
    S.interimWords = a.cores.filter(Boolean).length;
    interimText.innerHTML = ' ' + a.html;
    touchSpeech('word');
    if (toks.length > S.interimProcessed) advanceScript(toks.slice(S.interimProcessed));
    S.interimProcessed = toks.length;
  } else {
    S.interimWords = 0; S.interimProcessed = 0; interimText.innerHTML = '';
  }
  scrollTranscript();
}

function commitFinal(words) {
  words = (words || []).filter(Boolean);
  if (!words.length) return;
  const el = elapsed();
  const times = words.map((w, k) => { const t = S.interimTimes[k]; return t === undefined ? el : t; });
  const processed = S.interimProcessed;
  S.interimTimes = []; S.interim = ''; S.interimWords = 0; S.interimProcessed = 0;
  interimText.innerHTML = '';

  const a = analyze(words.join(' '), false);
  let prev = S.lastT;
  const tAt = [];
  a.cores.forEach((c, k) => {
    const t = Math.max(prev, times[k]);
    tAt[k] = t;
    if (!c) return;
    prev = t;
    S.wordEvents.push({ t, w: c });
    if (S.firstT === null) S.firstT = t;
    S.lastT = t;
  });
  if (a.hits.length) {
    a.hits.forEach((h, j) => {
      S.counts.set(h, (S.counts.get(h) || 0) + 1);
      addMarker('para', tAt[a.idx[j]] !== undefined ? tAt[a.idx[j]] : el, h);
    });
    S.parasites += a.hits.length;
    S.lastPara = a.hits[a.hits.length - 1];
    pulseCard();
    play.parasite();
  }
  S.chunks.push(a.html);
  finalText.insertAdjacentHTML('beforeend', a.html + ' ');
  touchSpeech('word');
  advanceScript(words.slice(processed));
  scrollTranscript();
}

function pulseCard() {
  const c = $('#cardPara');
  c.classList.remove('pulse-red');
  void c.offsetWidth;
  c.classList.add('pulse-red');
  setTimeout(() => c.classList.remove('pulse-red'), 950);
}
function scrollTranscript() { transcript.scrollTop = transcript.scrollHeight; }

/* ============ Живое распознавание речи ============ */
function createRecognizer() {
  const r = new SR();
  r.lang = S.lang || 'ru-RU';
  r.continuous = true;
  r.interimResults = true;
  r.maxAlternatives = 1;
  let lastFinal = -1;

  r.onstart = () => { lastFinal = -1; S.recStartedAt = performance.now(); };
  r.onaudiostart = () => { S.recAudio = true; S.lastRecAct = Date.now(); };
  r.onspeechstart = () => { S.lastRecAct = Date.now(); };

  r.onresult = e => {
    S.lastRecAct = Date.now();
    if (S.status !== 'running') return;
    S.netErr = 0;
    if (e.results.length <= lastFinal) lastFinal = -1;
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const res = e.results[i];
      const txt = (res[0] && res[0].transcript || '').trim();
      if (!txt) continue;
      if (res.isFinal) {
        if (i > lastFinal) {
          lastFinal = i;
          const key = txt.toLowerCase().replace(/\s+/g, ' ');
          if (key === S.lastFinalKey && Date.now() - S.lastFinalAt < 3000) continue;
          S.lastFinalKey = key; S.lastFinalAt = Date.now();
          commitFinal(txt.split(/\s+/));
        }
      } else { interim += ' ' + txt; }
    }
    setInterim(interim);
  };

  r.onerror = e => {
    const er = e.error;
    if (er === 'no-speech' || er === 'aborted') return;
    if (er === 'not-allowed' || er === 'service-not-allowed') { fatalLive('denied'); return; }
    if (er === 'audio-capture') { if (degradeAudio()) return; fatalLive('nomic'); return; }
    if (er === 'language-not-supported') { fatalLive('lang'); return; }
    if (er === 'network') {
      S.netErr++;
      if (S.netErr >= 3) { fatalLive('network'); return; }
      toast('Нет связи, пробую снова', 'amber');
      return;
    }
    toast('Ошибка распознавания: ' + er, 'amber');
  };

  r.onend = () => {
    if (S.interim && S.status === 'running' && S.rec === r) commitFinal(S.interim.split(/\s+/));
    if (S.rec !== r || S.status !== 'running' || S.mode !== 'live' || S.recFatal) return;
    const dt = performance.now() - S.recStartedAt;
    S.quickEnds = dt < 800 ? S.quickEnds + 1 : 0;
    if (S.quickEnds > 3 && degradeAudio()) S.quickEnds = 0;
    if (S.quickEnds > 8) { fatalLive('unstable'); return; }
    setTimeout(() => {
      if (S.rec === r && S.status === 'running' && !S.recFatal) {
        try { r.start(); } catch (err) { /* уже запущено */ }
      }
    }, S.quickEnds > 2 ? 600 : 100);
  };
  return r;
}

function teardownLive() {
  const r = S.rec;
  S.rec = null;
  if (r) {
    r.onstart = r.onaudiostart = r.onspeechstart = r.onresult = r.onerror = r.onend = null;
    try { r.abort(); } catch (e) { /* уже остановлено */ }
  }
}

function fatalLive(kind) {
  S.recFatal = true;
  if (S.status === 'running') { S.acc = elapsed(); S.status = 'paused'; stopTicker(); }
  teardownLive();
  if (kind === 'denied' || kind === 'nomic') stopAudio();
  S.starting = false;
  updateButtons();
  showNotice(kind);
}

function startRecognizer() {
  if (!SR) { showNotice('unsupported'); return false; }
  S.recFatal = false; S.quickEnds = 0; S.netErr = 0;
  S.recAudio = false; S.lastRecAct = 0; S.noRecMs = 0; S.recRestarts = 0; S.silentWarned = false;
  S.recBeganAt = performance.now();
  S.rec = createRecognizer();
  try { S.rec.start(); } catch (e) { /* уже запущено */ }
  return true;
}

function restartRecognizer() {
  if (S.mode !== 'live' || S.status !== 'running') return;
  if (S.interim) commitFinal(S.interim.split(/\s+/));
  teardownLive();
  setTimeout(() => {
    if (S.mode !== 'live' || S.status !== 'running' || S.rec) return;
    S.recFatal = false; S.recAudio = false; S.recBeganAt = performance.now();
    S.rec = createRecognizer();
    try { S.rec.start(); } catch (e) {
      setTimeout(() => { try { if (S.rec) S.rec.start(); } catch (e2) { /* не вышло */ } }, 300);
    }
  }, 300);
}

// Волна подключается позже и только после старта распознавания, чтобы не отбирать у него микрофон
let audioPending = false;
function attachAnalyser() {
  if (S.audioFallback || aud.analyser || audioPending) return;
  audioPending = true;
  setTimeout(async () => {
    if (S.mode !== 'live' || S.status !== 'running' || S.audioFallback) { audioPending = false; return; }
    const a = await initAudio();
    audioPending = false;
    if (a !== 'ok') { S.audioFallback = true; return; }
    if (S.status === 'idle' || S.status === 'finished' || S.mode !== 'live') stopAudio();
  }, 700);
}

/* ============ Демо-симуляция ============ */
function buildDemo() {
  const ev = [], speak = [];
  let t = 700;
  DEMO.forEach((seg, si) => {
    if (seg.pause) { t += seg.pause; return; }
    const base = 60000 / seg.wpm;
    const s0 = t;
    seg.t.split(/\s+/).forEach(w => {
      ev.push({ t, type: 'w', w, si });
      const len = norm(w).length;
      let d = base * (0.55 + 0.09 * Math.min(len, 10)) / 1.14;
      if (/[,;:]$/.test(w)) d += 160;
      t += d;
    });
    speak.push([s0, t, !!seg.mono]);
    ev.push({ t: t + 120, type: 'c', si });
    t += 420;
  });
  ev.push({ t: t + 700, type: 'end' });
  return { ev, speak, i: 0, cur: [] };
}

function demoTick(el) {
  const d = S.demo;
  if (!d) return;
  while (d.i < d.ev.length && d.ev[d.i].t <= el) {
    const e = d.ev[d.i++];
    if (e.type === 'w') { d.cur.push(e.w); setInterim(d.cur.join(' ')); }
    else if (e.type === 'c') { const ws = d.cur.slice(); d.cur = []; commitFinal(ws); }
    else if (e.type === 'end') { finishSession(); return; }
  }
  const seg = d.speak.find(r => el >= r[0] && el <= r[1]);
  S.demoSpeaking = !!seg;
  S.demoMono = !!(seg && seg[2]);
}

/* ============ Управление сессией ============ */
async function startSession() {
  if (S.status !== 'idle' || S.starting) return;
  hideNotice();
  S.starting = true;
  sfxCtx();
  if (S.mode === 'demo' && !scriptArea.value.trim()) { scriptArea.value = DEMO_SCRIPT; updateScriptStats(); }
  buildScript();
  if (S.mode === 'live' && !startRecognizer()) { S.starting = false; updateButtons(); return; }
  S.starting = false;
  S.acc = 0; S.segStart = performance.now(); S.status = 'running';
  S.lastSpeechTime = Date.now();
  if (S.mode === 'demo') S.demo = buildDemo();
  startTicker();
  play.start();
  updateButtons();
  if (S.mode === 'live') attachAnalyser();
}

function pauseSession() {
  if (S.status !== 'running') return;
  if (S.mode === 'live' && S.interim) commitFinal(S.interim.split(/\s+/));
  S.silenceCarry = S.mode === 'demo' ? Date.now() - S.lastSpeechTime : 0;
  S.acc = elapsed();
  S.status = 'paused';
  stopTicker();
  teardownLive();
  updateButtons();
}

function resumeSession() {
  if (S.status !== 'paused' || S.starting) return;
  hideNotice();
  sfxCtx();
  if (S.mode === 'live' && !startRecognizer()) return;
  S.segStart = performance.now();
  S.status = 'running';
  S.lastSpeechTime = Date.now() - S.silenceCarry;
  S.loudTicks = 0; S.deadMs = 0;
  startTicker();
  updateButtons();
  if (S.mode === 'live') attachAnalyser();
}

function finishSession() {
  if (S.status === 'idle') { toast('Сначала начните выступление', 'amber'); return; }
  if (S.status === 'finished') { showReport(); return; }
  if (S.interim && S.mode === 'live') commitFinal(S.interim.split(/\s+/));
  const el = elapsed();
  S.status = 'finished';
  S.acc = el;
  stopTicker();
  teardownLive();
  stopAudio();
  setInterim('');
  S.demoSpeaking = false;
  S.inPause = false;
  play.finish();
  updateButtons();
  showReport();
}

function resetAll() {
  stopTicker();
  teardownLive();
  stopAudio();
  const keepFallback = analyserBlocked();
  Object.assign(S, freshSession());
  S.audioFallback = keepFallback;
  finalText.innerHTML = ''; interimText.innerHTML = '';
  markersEl.innerHTML = '';
  hideTip();
  hideReport();
  if (S.chart) { S.chart.destroy(); S.chart = null; }
  buildScript();
  updateButtons();
}

function setMode(m) { S.mode = m; updateButtons(); }

function launchDemo() {
  if (S.mode === 'demo' && S.status === 'running') { toast('Демо уже идёт', 'blue'); return; }
  hideNotice();
  resetAll();
  setMode('demo');
  startSession();
}

function toggleMain() {
  if (S.starting) return;
  if (S.status === 'idle') startSession();
  else if (S.status === 'running') pauseSession();
  else if (S.status === 'paused') resumeSession();
  else if (S.status === 'finished') { resetAll(); startSession(); }
}

function updateButtons() {
  const map = { idle: ['play', 'Старт'], running: ['pause', 'Пауза'], paused: ['play', 'Продолжить'], finished: ['rotate-ccw', 'Заново'] };
  const [ic, tx] = map[S.status];
  const key = ic + tx;
  if (btnStart.dataset.k !== key) {
    btnStart.dataset.k = key;
    btnStart.innerHTML = '<i data-lucide="' + ic + '" class="w-4 h-4"></i><span>' + tx + '</span>';
    icons();
  }
  btnReport.disabled = S.status === 'idle';
  modeLive.setAttribute('aria-pressed', String(S.mode === 'live'));
  modeDemo.setAttribute('aria-pressed', String(S.mode === 'demo'));
}

/* ============ Метрики ============ */
function computeWpm(el) {
  const win = 15000, start = el - win;
  let n = 0;
  for (let i = S.wordEvents.length - 1; i >= 0; i--) { if (S.wordEvents[i].t >= start) n++; else break; }
  n += S.interimWords;
  const first = S.firstT === null ? el : S.firstT;
  const span = clamp(el - first, 4000, win);
  return n / (span / 60000);
}
function avgWpm() {
  const total = S.wordEvents.length;
  if (total < 3) return 0;
  const span = Math.max(S.lastT - S.firstT, 5000);
  return total / (span / 60000);
}
function paceStatus(w, enough) {
  if (!enough) return { tone: 'idle', label: 'Ожидание' };
  if (w < 90) return { tone: 'blue', label: 'Медленно' };
  if (w < 95) return { tone: 'amber', label: 'Почти' };
  if (w <= 145) return { tone: 'green', label: 'Норма' };
  if (w <= 150) return { tone: 'amber', label: 'Почти' };
  return { tone: 'red', label: 'Быстро' };
}
function purityPct() {
  const total = S.wordEvents.length;
  const share = total > 0 ? S.parasites / total : 0;
  return Math.round(clamp(100 - share * 100 * 3, 0, 100));
}

function updateMetrics(el) {
  S.wpmNow = computeWpm(el);
  S.wpmShown += (S.wpmNow - S.wpmShown) * 0.4;
  const enough = (S.wordEvents.length + S.interimWords) >= 6;
  const st = paceStatus(S.wpmNow, enough);
  S.paceTone = st.tone;
  setTone($('#cardWpm'), st.tone);
  setTone($('#wpmTag'), st.tone);
  setText($('#wpmVal'), String(Math.round(enough ? S.wpmShown : 0)));
  setText($('#wpmTag'), st.label);
  const avg = avgWpm();
  setText($('#wpmAvg'), avg ? 'ср ' + Math.round(avg) : 'ср —');
  const mark = $('#wpmMark');
  mark.style.left = 'calc(' + (clamp(enough ? S.wpmShown : 0, 0, 200) / 200 * 100).toFixed(1) + '% - 1.5px)';
  mark.style.opacity = enough ? '1' : '.3';

  const pur = purityPct();
  const pTone = pur >= 90 ? 'green' : (pur >= 75 ? 'amber' : 'red');
  setTone($('#cardPurity'), pTone); setTone($('#purityTag'), pTone);
  setText($('#purityVal'), pur + '%');
  setText($('#purityTag'), pur >= 90 ? 'Чисто' : (pur >= 75 ? 'Есть мусор' : 'Много мусора'));

  const pc = S.parasites;
  const cTone = pc === 0 ? 'green' : (pc <= 3 ? 'amber' : 'red');
  setTone($('#cardPara'), cTone); setTone($('#paraTag'), cTone);
  setText($('#paraVal'), String(pc));
  setText($('#paraTag'), S.lastPara ? '«' + S.lastPara + '»' : 'Нет');

  const pz = S.pauses;
  const hot = S.inPause && S.status === 'running';
  const zTone = hot ? 'amber' : (pz === 0 ? 'green' : (pz === 1 ? 'amber' : 'red'));
  setTone($('#cardPause'), zTone); setTone($('#pauseTag'), zTone);
  $('#cardPause').classList.toggle('hot', hot);
  setText($('#pauseVal'), String(pz));
  setText($('#pauseTag'), hot ? 'Пауза' : (pz === 0 ? 'Нет' : (pz === 1 ? 'Есть' : 'Много')));
  if (S.status === 'running' && S.hasSpoken) setText($('#silenceNow'), ((Date.now() - S.lastSpeechTime) / 1000).toFixed(1) + ' с');
  else setText($('#silenceNow'), '—');

  // Монотонность
  const mt = $('#monoTag');
  const noAudio = S.mode === 'live' && S.status !== 'idle' && !audioActive();
  if (noAudio) { setTone(mt, 'idle'); setText(mt, 'Нет данных'); setText($('#monoSigma'), ''); }
  else if (S.cv === null) { setTone(mt, 'idle'); setText(mt, S.status === 'idle' ? 'Нет данных' : 'Сбор'); setText($('#monoSigma'), ''); }
  else if (S.cv < MONO_CV) { setTone(mt, 'amber'); setText(mt, 'Монотонно'); setText($('#monoSigma'), 'σ ' + S.cv.toFixed(2)); }
  else { setTone(mt, 'green'); setText(mt, 'Живая интонация'); setText($('#monoSigma'), 'σ ' + S.cv.toFixed(2)); }

  // Заглушка текста
  const hasContent = finalText.textContent.trim() || S.interim;
  placeholder.classList.toggle('hide', !!hasContent);
  if (!hasContent) {
    placeholder.textContent = S.status === 'idle'
      ? (S.mode === 'demo' ? 'Нажмите Старт: демо начнётся само' : 'Нажмите Старт и говорите')
      : (S.mode === 'live' && S.talking && !S.lastRecAct ? 'Звук слышен, жду распознавание' : 'Слушаю');
  }
}

function updateTimerUI(el) {
  const total = S.target * 1000;
  const rem = total - el;
  const clock = $('#clock');
  setText(clock, rem >= 0 ? mmss2(Math.ceil(rem / 1000)) : '+' + mmss2(Math.floor(-rem / 1000)));
  const ratio = el / total;
  const col = ratio < 0.75 ? '#4ade80' : (ratio < 1 ? '#fbbf24' : '#f87171');
  clock.style.color = col;
  const fill = $('#tlFill');
  fill.style.width = clamp(ratio * 100, 0, 100) + '%';
  fill.style.background = col;
  setText($('#tlElapsed'), fmtMs(el));
  setText($('#tlTotal'), fmtMs(total));
  if (S.status === 'running' && el >= total && !S.overNotified) {
    S.overNotified = true;
    toast('Регламент закончился', 'red');
  }
}

/* ============ Звуковая волна ============ */
const bars = new Float32Array(NB), tgt = new Float32Array(NB);

function fitCanvas(c) {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(1, Math.round(c.clientWidth * dpr)), h = Math.max(1, Math.round(c.clientHeight * dpr));
  if (c.width !== w || c.height !== h) { c.width = w; c.height = h; }
  return { w, h, dpr };
}

function simulate(t, amp) {
  for (let i = 0; i < NB; i++) {
    const f = i / NB;
    const prof = Math.exp(-f * 3.2) * (0.55 + 0.45 * Math.sin(i * 0.85 + t * 0.009 + Math.sin(t * 0.0027 + i * 0.3) * 2.2));
    tgt[i] = clamp(amp * prof * (0.85 + 0.15 * Math.sin(t * 0.02 + i * 1.7)) * 1.5, 0, 1);
  }
}

function updateBars(now) {
  const running = S.status === 'running';
  if (S.mode === 'live' && audioActive()) {
    const a = aud.analyser;
    a.getByteFrequencyData(aud.fft);
    const learning = now - aud.calib < 700;
    let sig = 0;
    for (let i = 0; i < NB; i++) {
      const v = aud.fft[i];
      const s = Math.max(0, v - aud.noise[i] * 1.12 - 6);
      if (i < 32) sig += s;
      tgt[i] = Math.min(1, s / 140);
    }
    sig = learning ? 0 : sig / (32 * 255);
    const talking = sig > SPEECH_THR;
    for (let i = 0; i < NB; i++) {
      if (!talking) { aud.noise[i] += (aud.fft[i] - aud.noise[i]) * (learning ? 0.3 : 0.03); tgt[i] = 0; }
    }
    S.sig = sig; S.talking = talking; S.loudNow = sig;
    if (sig > S.sigMax) S.sigMax = sig;
  } else if (running && S.mode === 'demo') {
    const slow = S.demoMono ? 0.6 : 0.25 + 0.75 * (0.5 + 0.5 * Math.sin(now * 0.0024));
    const fast = 0.55 + 0.45 * Math.abs(Math.sin(now * 0.0105));
    const amp = S.demoSpeaking ? slow * fast : 0;
    simulate(now, amp);
    S.sig = amp * 0.2; S.talking = S.demoSpeaking; S.loudNow = amp;
    if (!S.demoSpeaking) for (let i = 0; i < NB; i++) tgt[i] = 0;
  } else if (running && S.mode === 'live') {
    const talking = S.hasSpoken && (Date.now() - S.lastWordTime) < 900;
    simulate(now, talking ? 0.5 + 0.4 * Math.abs(Math.sin(now * 0.0105)) : 0);
    if (!talking) for (let i = 0; i < NB; i++) tgt[i] = 0;
    S.sig = 0; S.talking = talking; S.loudNow = 0;
  } else {
    for (let i = 0; i < NB; i++) tgt[i] = 0;
    S.sig = 0; S.talking = false; S.loudNow = 0;
  }
}

function drawWave(now) {
  updateBars(now);
  const { w, h, dpr } = fitCanvas(wave);
  const c = wctx;
  c.clearRect(0, 0, w, h);
  let peak = 0;
  for (let i = 0; i < NB; i++) {
    bars[i] += (tgt[i] - bars[i]) * (tgt[i] > bars[i] ? 0.6 : 0.2);
    if (bars[i] > peak) peak = bars[i];
  }
  const step = w / NB, bw = Math.max(1.5 * dpr, step * 0.5), cy = h / 2, maxH = h * 0.46;
  c.strokeStyle = S.inPause && S.status === 'running' ? '#fbbf24' : (peak > 0.04 ? '#4ade80' : '#52525b');
  c.lineCap = 'round';
  c.lineWidth = bw;
  c.beginPath();
  for (let i = 0; i < NB; i++) {
    const x = (i + 0.5) * step;
    const hh = Math.max(0.6 * dpr, bars[i] * maxH);
    c.moveTo(x, cy - hh);
    c.lineTo(x, cy + hh);
  }
  c.stroke();
}

/* ============ Главный цикл ============ */
let lastUi = 0;
function frame() {
  requestAnimationFrame(frame);
  const now = performance.now();
  const el = elapsed();
  if (S.status === 'running' && S.mode === 'demo') demoTick(el);
  drawWave(now);
  if (S.status === 'running' && now - S.lastLoudSample >= 100) {
    S.lastLoudSample = now;
    const speaking = S.mode === 'demo' ? S.demoSpeaking : (audioActive() && S.talking);
    if (speaking) { S.loud.push(S.loudNow); if (S.loud.length > 100) S.loud.shift(); }
  }
  if (now - lastUi > 120) {
    lastUi = now;
    updateTimerUI(el);
    updateMetrics(el);
  }
}

/* ============ Суфлёр ============ */
function buildScript() {
  const toks = scriptArea.value.match(/\S+/g) || [];
  prompter.innerHTML = '';
  S.script = { cores: [], spans: [] };
  S.ptr = 0; S.painted = 0; S.curEl = null;
  if (!toks.length) {
    prompter.innerHTML = '<p class="text-zinc-500">Нет текста</p>';
    return;
  }
  const frag = document.createDocumentFragment();
  toks.forEach(t => {
    const sp = document.createElement('span');
    sp.className = 'sw';
    sp.textContent = t + ' ';
    frag.appendChild(sp);
    S.script.cores.push(norm(t));
    S.script.spans.push(sp);
  });
  prompter.appendChild(frag);
  paintScript();
}

function advanceScript(words) {
  const sc = S.script;
  if (!sc || !sc.cores.length) return;
  for (const w of words) {
    const c = norm(w);
    if (c.length < 3) continue;
    const lim = Math.min(sc.cores.length, S.ptr + 9);
    for (let j = S.ptr; j < lim; j++) {
      const s = sc.cores[j];
      if (s === c || (s.length >= 5 && c.length >= 5 && s.slice(0, 5) === c.slice(0, 5))) { S.ptr = j + 1; break; }
    }
  }
  paintScript();
}

function paintScript() {
  const sc = S.script;
  if (!sc || !sc.spans.length) return;
  for (let k = S.painted; k < S.ptr && k < sc.spans.length; k++) sc.spans[k].classList.add('read');
  if (S.curEl) S.curEl.classList.remove('cur');
  const cur = sc.spans[S.ptr];
  if (cur) {
    cur.classList.add('cur');
    S.curEl = cur;
    prompter.scrollTo({ top: Math.max(0, cur.offsetTop - prompter.clientHeight * 0.4), behavior: 'smooth' });
  } else { S.curEl = null; }
  S.painted = S.ptr;
}

function updateScriptStats() {
  const words = (scriptArea.value.match(/\S+/g) || []).filter(w => norm(w)).length;
  const stats = $('#scriptStats'), fit = $('#scriptFit');
  if (!words) { stats.textContent = '0 слов'; fit.classList.add('hide'); return; }
  const sec = words / 130 * 60;
  stats.textContent = words + ' слов · ' + mmss(sec);
  const ratio = sec / S.target;
  fit.classList.remove('hide');
  if (ratio > 1.05) { setTone(fit, 'red'); fit.textContent = '+' + mmss(sec - S.target); }
  else if (ratio < 0.7) { setTone(fit, 'amber'); fit.textContent = '−' + mmss(S.target - sec); }
  else { setTone(fit, 'green'); fit.textContent = 'В регламент'; }
}

function setScriptView(view) {
  const prompt = view === 'prompt';
  if (prompt) buildScript();
  scriptArea.classList.toggle('hide', prompt);
  prompter.classList.toggle('hide', !prompt);
  $('#viewEdit').setAttribute('aria-pressed', String(!prompt));
  $('#viewPrompt').setAttribute('aria-pressed', String(prompt));
  if (prompt) paintScript();
}

/* ============ Словарь ============ */
function renderChips() {
  const box = $('#chips');
  box.innerHTML = '';
  if (!S.dict.length) { box.innerHTML = '<p class="text-zinc-500">Список пуст</p>'; return; }
  S.dict.forEach((w, idx) => {
    const d = document.createElement('span');
    d.className = 'chip';
    d.appendChild(document.createTextNode(w));
    const b = document.createElement('button');
    b.type = 'button';
    b.setAttribute('aria-label', 'Убрать «' + w + '»');
    b.innerHTML = '<i data-lucide="x" class="w-3.5 h-3.5"></i>';
    b.addEventListener('click', () => { S.dict.splice(idx, 1); saveDict(); renderChips(); });
    d.appendChild(b);
    box.appendChild(d);
  });
  icons();
}
function saveDict() { store.set('speechRadar.dict', JSON.stringify(S.dict)); rebuildIndex(); }

/* ============ Отчёт ============ */
function computeReport() {
  const el = S.acc;
  const total = S.wordEvents.length;
  const buckets = [];
  const nB = Math.ceil(el / 10000);
  for (let k = 0; k < nB; k++) {
    const a = k * 10000, b = Math.min((k + 1) * 10000, el), L = b - a;
    if (L < 3000) continue;
    const last = k === nB - 1;
    const n = S.wordEvents.filter(e => e.t >= a && (e.t < b || (last && e.t <= b))).length;
    buckets.push({ label: last && L < 10000 ? fmtMs(el) : fmtMs(b), wpm: Math.round(n / (L / 60000)) });
  }
  const avg = Math.round(avgWpm());
  const purity = purityPct();
  const inRange = buckets.filter(b => b.wpm >= 95 && b.wpm <= 145).length;
  const idealRatio = buckets.length ? inRange / buckets.length : 0;
  const intoSecs = S.monoSecs + S.liveSecs;
  const intoPct = intoSecs >= 5 ? Math.round(S.liveSecs / intoSecs * 100) : null;

  let score = 0;
  if (total > 0) {
    const dist = avg < 95 ? 95 - avg : (avg > 145 ? avg - 145 : 0);
    const avgFactor = clamp(1 - dist / 60, 0, 1);
    const pace = 30 * (0.5 * avgFactor + 0.5 * idealRatio);
    const clean = 30 * purity / 100;
    const pz = Math.max(0, 15 - 5 * S.pauses);
    const ratio = el / (S.target * 1000);
    let time;
    if (ratio >= 0.8 && ratio <= 1.05) time = 10;
    else if (ratio < 0.8) time = 10 * Math.max(0, 1 - (0.8 - ratio) / 0.6);
    else time = 10 * Math.max(0, 1 - (ratio - 1.05) / 0.4);
    let sum = pace + clean + pz + time, max = 85;
    if (intoPct !== null) { sum += 15 * intoPct / 100; max += 15; }
    score = Math.round(clamp(sum / max * 100, 0, 100));
  }
  return { el, total, buckets, avg, purity, intoPct, score };
}

function buildTips(R) {
  const tips = [];
  const add = (tone, icon, title, text) => tips.push({ tone, icon, title, text });
  const peak = R.buckets.reduce((m, b) => (!m || b.wpm > m.wpm ? b : m), null);
  const low = R.buckets.filter(b => b.wpm > 0).reduce((m, b) => (!m || b.wpm < m.wpm ? b : m), null);
  let paceTips = 0;

  if (R.total === 0) {
    add('red', 'mic-off', 'Речь не распознана', 'Проверьте доступ к микрофону или запустите демо.');
    return tips;
  }
  if (R.avg > 150) {
    add('red', 'gauge', 'Слишком быстро', 'Средний темп ' + R.avg + ' сл/мин' + (peak ? ', пик ' + peak.wpm + ' на ' + peak.label : '') + '. Дышите в конце каждой мысли.');
    paceTips++;
  } else if (peak && peak.wpm > 150) {
    add('amber', 'gauge', 'Местами тараторите', 'На ' + peak.label + ' темп ' + peak.wpm + ' сл/мин. Замедляйтесь на выводах и цифрах.');
    paceTips++;
  }
  if (R.avg > 0 && R.avg < 90) {
    add('blue', 'gauge', 'Темп ниже нормы', 'Средний темп ' + R.avg + ' сл/мин. Сократите вступление и говорите бодрее.');
    paceTips++;
  } else if (low && low.wpm < 90 && R.buckets.length >= 3) {
    add('blue', 'gauge', 'Просадка темпа', 'На ' + low.label + ' темп упал до ' + low.wpm + ' сл/мин. Подготовьте опорные слова.');
    paceTips++;
  }
  if (!paceTips) add('green', 'check-circle-2', 'Темп в норме', 'Средний темп ' + R.avg + ' сл/мин.');

  if (S.parasites === 0) {
    add('green', 'check-circle-2', 'Речь чистая', 'Слов-паразитов нет.');
  } else {
    const sorted = Array.from(S.counts.entries()).sort((a, b) => b[1] - a[1]);
    add(R.purity >= 75 ? 'amber' : 'red', 'ban', 'Слова-паразиты: ' + S.parasites,
      '«' + sorted[0][0] + '» — ' + sorted[0][1] + ' ' + plural(sorted[0][1]) + '. Заменяйте их короткой паузой.');
  }

  if (S.pauses > 0) {
    const when = S.markers.filter(m => m.type === 'pause').slice(0, 3).map(m => fmtMs(m.t)).join(', ');
    add(S.pauses > 1 ? 'red' : 'amber', 'hourglass', 'Паузы: ' + S.pauses, 'Тишина дольше ' + (S.pauseMs / 1000).toFixed(1) + ' с на ' + when + '. Держите под рукой шпаргалку.');
  } else {
    add('green', 'check-circle-2', 'Без заминок', 'Пауз дольше ' + (S.pauseMs / 1000).toFixed(1) + ' с не было.');
  }

  if (R.intoPct === null) {
    add('idle', 'audio-lines', 'Интонация', 'Недостаточно данных о громкости голоса.');
  } else if (R.intoPct < 35) {
    add('amber', 'audio-lines', 'Монотонная речь', 'Живая интонация только ' + R.intoPct + '% времени. Выделяйте ключевые слова громкостью.');
  } else if (R.intoPct < 65) {
    add('amber', 'audio-lines', 'Интонация неровная', 'Живая интонация ' + R.intoPct + '% времени. Добавляйте акценты в середине доклада.');
  } else {
    add('green', 'check-circle-2', 'Живая интонация', 'Перепады громкости на ' + R.intoPct + '% речи.');
  }

  const ratio = R.el / (S.target * 1000);
  if (ratio < 0.6) add('amber', 'timer', 'Короче регламента', fmtMs(R.el) + ' из ' + fmtMs(S.target * 1000) + '. Добавьте пример или вывод.');
  else if (ratio > 1.05) add('red', 'timer', 'Регламент превышен', '+' + mmss((R.el - S.target * 1000) / 1000) + ' сверх лимита. Сократите вступление.');
  else add('green', 'check-circle-2', 'В регламенте', fmtMs(R.el) + ' из ' + fmtMs(S.target * 1000) + '.');
  return tips;
}

function verdictFor(score, total) {
  if (total === 0) return 'Речь не распознана';
  if (score >= 90) return 'Отлично: уверенно и чисто';
  if (score >= 75) return 'Сильно, есть мелкие недочёты';
  if (score >= 55) return 'Хорошая основа';
  if (score >= 30) return 'Нужна репетиция';
  return 'Тренируйтесь дальше';
}

function showReport() {
  const R = computeReport();
  const tone = R.total === 0 ? 'red' : (R.score >= 75 ? 'green' : (R.score >= 50 ? 'amber' : 'red'));
  const sc = $('#scoreCard');
  setTone(sc, tone);
  const colMap = { green: '#4ade80', amber: '#fbbf24', red: '#f87171' };
  const col = colMap[tone];
  sc.style.setProperty('--c', col);
  $('#verdict').textContent = verdictFor(R.score, R.total);

  const stats = [
    ['Темп', R.avg ? R.avg + '' : '—'],
    ['Чистота', R.purity + '%'],
    ['Паразиты', String(S.parasites)],
    ['Паузы', String(S.pauses)],
    ['Время', fmtMs(R.el)],
    ['Интонация', R.intoPct === null ? '—' : R.intoPct + '%']
  ];
  $('#scoreStats').innerHTML = stats.map(s =>
    '<div class="rounded-md border px-2 py-1.5" style="border-color:var(--line)"><div class="text-[.7rem]" style="color:var(--dim)">' + esc(s[0]) + '</div><div class="num text-lg font-medium">' + esc(s[1]) + '</div></div>'
  ).join('');

  $('#tips').innerHTML = buildTips(R).map(t =>
    '<div class="tip-row t-' + t.tone + '"><i data-lucide="' + t.icon + '" class="w-4 h-4"></i><div><h4>' + esc(t.title) + '</h4><p>' + esc(t.text) + '</p></div></div>'
  ).join('');

  // Интонация
  const into = $('#intoBox');
  if (R.intoPct === null) {
    into.innerHTML = '<div class="num text-3xl font-medium" style="color:var(--dim)">—</div><p class="text-zinc-500 text-sm mt-1">Нет данных</p>';
  } else {
    const itone = R.intoPct >= 65 ? 'green' : 'amber';
    const label = R.intoPct >= 65 ? 'Живая интонация' : (R.intoPct >= 35 ? 'Местами монотонно' : 'Монотонно');
    const avgCv = S.cvHist.length ? S.cvHist.reduce((a, b) => a + b.cv, 0) / S.cvHist.length : 0;
    into.innerHTML =
      '<div class="t-' + itone + ' flex items-end justify-between gap-2"><div class="num text-4xl font-medium" style="color:var(--c)">' + R.intoPct + '%</div><span class="tag">' + esc(label) + '</span></div>' +
      '<div class="flex h-2 rounded-sm overflow-hidden mt-3"><div style="width:' + R.intoPct + '%;background:var(--g)"></div><div style="width:' + (100 - R.intoPct) + '%;background:var(--a)"></div></div>' +
      '<div class="flex justify-between num text-xs mt-1.5" style="color:var(--dim)"><span>живая ' + S.liveSecs + ' с</span><span>монотонная ' + S.monoSecs + ' с</span></div>' +
      '<div class="num text-xs mt-2" style="color:var(--dim)">σ среднее ' + avgCv.toFixed(2) + '</div>';
  }

  const sorted = Array.from(S.counts.entries()).sort((a, b) => b[1] - a[1]);
  const maxN = sorted.length ? sorted[0][1] : 1;
  $('#topPara').innerHTML = sorted.length
    ? sorted.map(([w, n]) => '<div><div class="flex justify-between mb-1"><span class="font-medium">«' + esc(w) + '»</span><span class="num" style="color:var(--r)">×' + n + '</span></div><div class="bar-track"><div class="bar-fill" data-w="' + Math.round(n / maxN * 100) + '"></div></div></div>').join('')
    : '<p class="text-zinc-500">Нет</p>';

  $('#reportText').innerHTML = S.chunks.length ? S.chunks.join(' ') : '<span class="text-zinc-500">Нет текста</span>';

  $('#report').classList.remove('hide');
  $('#report').scrollTop = 0;
  icons();

  const ring = $('#ringFg');
  ring.setAttribute('stroke', col);
  ring.style.strokeDashoffset = '326.73';
  requestAnimationFrame(() => requestAnimationFrame(() => {
    ring.style.strokeDashoffset = String(326.73 * (1 - R.score / 100));
    $$('.bar-fill').forEach(b => { b.style.width = b.dataset.w + '%'; });
  }));
  const num = $('#scoreNum');
  const t0 = performance.now();
  const countUp = now => {
    const p = clamp((now - t0) / 1000, 0, 1);
    num.textContent = String(Math.round(R.score * (1 - Math.pow(1 - p, 3))));
    if (p < 1) requestAnimationFrame(countUp);
  };
  requestAnimationFrame(countUp);

  drawChart(R.buckets);
}

function drawChart(buckets) {
  if (S.chart) { S.chart.destroy(); S.chart = null; }
  const canvas = $('#chartCanvas'), empty = $('#chartEmpty'), wrap = $('#chartWrap');
  if (!window.Chart) { wrap.classList.add('hide'); empty.classList.remove('hide'); empty.textContent = 'Chart.js не загрузился'; return; }
  if (!buckets.length) { wrap.classList.add('hide'); empty.classList.remove('hide'); empty.textContent = 'Слишком короткое выступление'; return; }
  wrap.classList.remove('hide'); empty.classList.add('hide');

  Chart.defaults.font.family = 'Inter, sans-serif';
  Chart.defaults.font.size = 12;
  const colorFor = v => v < 90 ? '#60a5fa' : (v < 95 || (v > 145 && v <= 150) ? '#fbbf24' : (v <= 145 ? '#4ade80' : '#f87171'));
  const labels = buckets.map(b => b.label);
  const data = buckets.map(b => b.wpm);
  const maxV = Math.max(200, Math.max.apply(null, data) + 20);
  const mono = 'JetBrains Mono, monospace';

  S.chart = new Chart(canvas.getContext('2d'), {
    type: 'line',
    data: {
      labels,
      datasets: [
        { label: 'min', data: labels.map(() => 95), borderColor: 'rgba(74,222,128,.35)', borderDash: [4, 4], borderWidth: 1, pointRadius: 0, fill: false },
        { label: 'Норма 95–145', data: labels.map(() => 145), borderColor: 'rgba(74,222,128,.35)', borderDash: [4, 4], borderWidth: 1, pointRadius: 0, fill: '-1', backgroundColor: 'rgba(74,222,128,.08)' },
        {
          label: 'Темп, сл/мин', data, borderColor: '#e4e4e7', borderWidth: 2, tension: 0.3,
          pointRadius: 5, pointHoverRadius: 7, pointBackgroundColor: data.map(colorFor), pointBorderColor: '#09090b', pointBorderWidth: 2,
          segment: { borderColor: ctx => colorFor(ctx.p1.parsed.y) }
        }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      animation: { duration: 800 },
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { labels: { color: '#a1a1aa', boxWidth: 10, filter: item => item.datasetIndex !== 0 } },
        tooltip: { filter: item => item.datasetIndex === 2, backgroundColor: '#18181b', borderColor: '#3f3f46', borderWidth: 1, bodyFont: { family: mono }, callbacks: { label: c => ' ' + c.parsed.y + ' сл/мин' } }
      },
      scales: {
        x: { ticks: { color: '#71717a', font: { family: mono } }, grid: { color: 'rgba(63,63,70,.35)' } },
        y: { min: 0, suggestedMax: maxV, ticks: { color: '#71717a', font: { family: mono } }, grid: { color: 'rgba(63,63,70,.35)' } }
      }
    }
  });
}

function hideReport() { $('#report').classList.add('hide'); }

/* ============ События ============ */
btnStart.addEventListener('click', toggleMain);
btnReport.addEventListener('click', finishSession);
btnReset.addEventListener('click', () => { resetAll(); toast('Сброс', 'idle'); });
btnSound.addEventListener('click', () => {
  sfx.on = !sfx.on;
  btnSound.setAttribute('aria-pressed', String(sfx.on));
  btnSound.innerHTML = '<i data-lucide="' + (sfx.on ? 'volume-2' : 'volume-x') + '" class="w-4 h-4"></i>';
  icons();
  if (sfx.on) { sfxCtx(); play.start(); }
});

modeLive.addEventListener('click', () => {
  if (S.mode === 'live') return;
  resetAll(); hideNotice(); setMode('live');
});
modeDemo.addEventListener('click', () => {
  if (S.mode === 'demo' && S.status === 'running') return;
  if (S.mode === 'demo' && S.status === 'paused') { resumeSession(); return; }
  launchDemo();
});

$('#noticeDemo').addEventListener('click', launchDemo);
$('#noticeClose').addEventListener('click', hideNotice);
$('#reportBack').addEventListener('click', hideReport);
$('#reportNew').addEventListener('click', () => { resetAll(); });

$$('#targetSeg button').forEach(b => b.addEventListener('click', () => {
  S.target = Number(b.dataset.sec);
  S.overNotified = false;
  $$('#targetSeg button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  updateScriptStats();
  renderMarkers();
}));

$$('.tab').forEach(t => t.addEventListener('click', () => {
  $$('.tab').forEach(x => x.setAttribute('aria-selected', String(x === t)));
  ['live', 'script', 'dict'].forEach(n => $('#pane-' + n).classList.toggle('on', n === t.dataset.tab));
  if (t.dataset.tab === 'live') scrollTranscript();
  if (t.dataset.tab === 'script' && !prompter.classList.contains('hide')) paintScript();
}));

$('#addForm').addEventListener('submit', e => {
  e.preventDefault();
  const inp = $('#addInput');
  const v = inp.value.toLowerCase().replace(/ё/g, 'е').replace(/\s+/g, ' ').trim();
  if (!v) return;
  if (S.dict.includes(v)) { toast('Уже есть', 'amber'); return; }
  S.dict.push(v); saveDict(); renderChips();
  inp.value = '';
  toast('Добавлено: ' + v, 'green');
});
$('#dictReset').addEventListener('click', () => { S.dict = DEFAULT_WORDS.slice(); saveDict(); renderChips(); toast('Список по умолчанию', 'idle'); });

$('#pauseRange').addEventListener('input', e => {
  S.pauseMs = Number(e.target.value) * 1000;
  $('#pauseRangeVal').textContent = Number(e.target.value).toFixed(1) + ' с';
});

scriptArea.addEventListener('input', () => { updateScriptStats(); buildScript(); });
$('#viewEdit').addEventListener('click', () => setScriptView('edit'));
$('#viewPrompt').addEventListener('click', () => setScriptView('prompt'));
$('#scriptSample').addEventListener('click', () => { scriptArea.value = DEMO_SCRIPT; updateScriptStats(); buildScript(); });
$('#scriptClear').addEventListener('click', () => { scriptArea.value = ''; updateScriptStats(); buildScript(); });

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#report').classList.contains('hide')) { hideReport(); return; }
  const tag = (e.target.tagName || '').toUpperCase();
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || tag === 'BUTTON' || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === 'd' || e.key === 'D' || e.key === 'в' || e.key === 'В') { e.preventDefault(); launchDemo(); }
  else if (e.code === 'Space') { e.preventDefault(); toggleMain(); }
});

window.addEventListener('beforeunload', () => { teardownLive(); stopAudio(); });

/* ============ Инициализация ============ */
function init() {
  rebuildIndex();
  renderChips();
  renderMarkers();
  updateScriptStats();
  buildScript();
  updateButtons();
  icons();
  if (!SR) showNotice('unsupported');
  else if (!window.isSecureContext && location.protocol !== 'file:') showNotice('insecure');
  requestAnimationFrame(frame);
}
init();

})();
</script>
